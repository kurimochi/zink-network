[package]
name = "node"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.0.30", features = ["eip712", "provider-ws", "providers", "signers"] }
bincode = "1.3.3"
common = { path = "../common" }
dotenv = "0.15.0"
libp2p = { version = "0.56.0", features = ["gossipsub", "macros", "mdns", "noise", "tcp", "tokio", "yamux"] }
serde = "1.0.219"
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
clap = { version = "4.5.4", features = ["derive"] }
once_cell = "1.21.3"
